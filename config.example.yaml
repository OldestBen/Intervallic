# Intervallic — example config
# Run  intervallic setup  to generate this interactively.

plex:
  url: "http://192.168.1.10:32400"
  token: "YOUR_PLEX_TOKEN_HERE"
  playlist_filter: []   # empty = sync all playlists
  playlist_exclude: []

# ── Option A: SMB share (Roon's native SMB connectivity) ────────────────────
# Use this when Roon connects to your NAS directly via Settings → Storage.
# Files are written straight to the share — no SSH needed.
output:
  format: m3u8
  overwrite: true
  smb:
    server: "192.168.1.20"     # NAS IP or hostname
    share: "music"             # share name as configured in Roon Storage
    directory: "Playlists"     # subfolder within the share (created if absent)
    username: "roon"
    password: "secret"
    # domain: ""               # leave blank for workgroup / local accounts

# ── Option B: SFTP to Roon host ─────────────────────────────────────────────
# output:
#   format: m3u8
#   overwrite: true
#   sftp:
#     host: "192.168.2.50"
#     port: 22
#     username: "root"
#     remote_directory: "/mnt/music/Playlists"
#     key_path: "~/.ssh/id_rsa"
#     # password: "secret"

# ── Option C: local path ────────────────────────────────────────────────────
# output:
#   format: m3u8
#   overwrite: true
#   directory: "/mnt/music/Playlists"

# Path translation: Plex file paths → paths Roon sees on the same share.
# Only needed if Plex and Roon mount the same library at different paths.
path_mapping:
  - from: "/data/music"
    to: "/music"
